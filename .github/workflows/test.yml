name: 'CI / Test'

on:
  workflow_dispatch:

jobs:
  tag-platforms:
    name: 'Tag / Platforms'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            env:
              npm_config_arch: 'x64'
              RUST_BACKTRACE: '1'
            script: |
              # nix develop .#ci --command bash -c $'
              npm install
              npm run prebuild --verbose -- --production
              '
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            env:
              npm_config_arch: 'arm64'
              RUST_BACKTRACE: '1'
            script: |
              # nix develop .#ci --command bash -c $'
              npm install
              npm run prebuild --verbose -- --production
              '
    steps:
      - uses: actions/checkout@v4
      # - if: startsWith(matrix.platform, 'linux')
      #   uses: ./.github/workflows/matrixai-env-setup
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - if: startsWith(matrix.platform, 'linux')
        run: |
          echo "Updating package lists..."
          sudo apt-get update
          echo "Installing dependencies..."
          sudo apt-get install -y curl build-essential gcc g++ pkg-config python3 python3-pip cmake git libclang-dev clang
      - name: Build
        env: ${{ matrix.env }}
        run: ${{ matrix.script }}
